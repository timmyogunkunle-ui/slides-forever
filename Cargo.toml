[package]
name = "slides-forever"
version = "1.1.0"
description = "Slides Forever - fast, simple worship presentation software"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
regex = "1"
rfd = "0.15"
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Devices_Display"] }
windows = { version = "0.62", features = ["Foundation", "Data_Pdf", "Storage", "Storage_Streams", "Win32_System_Com"] }

[features]
# Embed the UI into the exe (what `tauri build` would normally switch on).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
